{% set name = "gpyreg" %}
{% set version = "1.3.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5de5baec60d061bb0348af7907498ca1f06c5fc1dee96526cbbdc6d543db050d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=45
    - setuptools-scm >=6.2
    - pip
  run:
    - python >={{ python_min }}
    - matplotlib-base >=3.5.1
    - numdifftools >=0.9.41
    - numpy >=1.22.1
    - pytest >=6.2.5
    - pytest-rerunfailures >=10.2
    - scipy >=1.7.3

test:
  imports:
    - gpyreg
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/GPyReg/
  doc_url: https://acerbilab.github.io/gpyreg/
  dev_url: https://github.com/acerbilab/gpyreg/
  summary: Lightweight package for Gaussian process regression.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Bobby-Huggins
    - lacerbi
